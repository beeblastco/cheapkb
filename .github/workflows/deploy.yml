name: Deploy Production

permissions:
  contents: read

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  AWS_REGION: us-east-1
  BEDROCK_EMBEDDING_MODEL: us.cohere.embed-v4:0
  BEDROCK_ASSUME_ROLE_ARN: ${{ vars.BEDROCK_ASSUME_ROLE_ARN }}
  BEDROCK_ASSUME_ROLE_EXTERNAL_ID: ${{ vars.BEDROCK_ASSUME_ROLE_EXTERNAL_ID }}
  CHUNK_MAX_TOKENS: "700"
  CHUNK_OVERLAP_TOKENS: "100"
  MAX_UPLOAD_BYTES: "52428800"
  MAX_IMAGE_UPLOAD_BYTES: "5242880"
  MAX_CHUNKS_PER_DOCUMENT: "1000"
  EMBEDDING_INPUT_PRICE_PER_1M_TOKENS: "0.12"
  VECTOR_BATCH: "500"
  EMBED_BATCH: "10"

jobs:
  check:
    name: Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: "22"
          cache: npm
      - run: npm ci --legacy-peer-deps
      - run: npm --prefix web ci --legacy-peer-deps
      - run: npm run lint
      - run: npm run format:check
      - run: npm run build
      - run: npm test
      - run: API_URL=https://example.execute-api.us-east-1.amazonaws.com/v1 npm --prefix web run build
      # Writes the bundle size table to the job summary and fails on growth.
      - run: npm run bundle:check
      # PRs fail on new high advisories; main still deploys. Each allowed advisory has no fixed release and only
      # reaches tooling, and its exception fails the check once GitHub names a fix or npm stops reporting it.
      - if: github.event_name == 'pull_request'
        env:
          ALLOWED_ADVISORIES: "GHSA-ch52-4w7c-c8xp GHSA-vfj7-8cjw-p6xm"
          GH_TOKEN: ${{ github.token }}
        run: |
          npm audit --json > audit-root.json || true
          npm --prefix web audit --json > audit-web.json || true
          jq -s -r '[.[].vulnerabilities[]?.via[] | objects | .url | split("/") | last] | unique | .[]' audit-*.json > reported.txt
          jq -s -r '[.[].vulnerabilities[]?.via[] | objects | select(.severity == "high" or .severity == "critical") | .url | split("/") | last] | unique | .[]' audit-*.json > high.txt
          : > blocking.txt
          for ghsa in $(grep -v -x -F -f <(tr ' ' '\n' <<< "$ALLOWED_ADVISORIES") high.txt || true); do
            echo "$ghsa is a new high advisory" >> blocking.txt
          done
          for ghsa in $ALLOWED_ADVISORIES; do
            grep -q -x "$ghsa" reported.txt || echo "$ghsa is no longer reported; remove its exception" >> blocking.txt
            if ! patched=$(gh api "/advisories/$ghsa" --jq '[.vulnerabilities[].first_patched_version // empty] | join(", ")' 2>/dev/null); then
              echo "::warning::Could not look up $ghsa on GitHub"
              patched=""
            fi
            [ -z "$patched" ] || echo "$ghsa is fixed in $patched; update the dependency and remove its exception" >> blocking.txt
          done
          if [ -s blocking.txt ]; then cat blocking.txt; exit 1; fi

  secrets-scan:
    name: Secrets scan
    runs-on: ubuntu-latest
    env:
      GITLEAKS_VERSION: 8.30.1
      GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          # The range scan needs history.
          fetch-depth: 0
          persist-credentials: false
      - name: Install gitleaks
        run: |
          curl -fsSL -o /tmp/gitleaks.tar.gz "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  /tmp/gitleaks.tar.gz" | sha256sum --check
          mkdir -p /tmp/gitleaks
          tar -xzf /tmp/gitleaks.tar.gz -C /tmp/gitleaks gitleaks
      - name: Scan new commits for secrets
        env:
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
          PUSH_BEFORE: ${{ github.event.before }}
        run: |
          if [ -n "$PR_BASE" ]; then
            range="$PR_BASE..$PR_HEAD"
          elif git cat-file -e "$PUSH_BEFORE^{commit}" 2>/dev/null; then
            range="$PUSH_BEFORE..$GITHUB_SHA"
          else
            range="$GITHUB_SHA~1..$GITHUB_SHA"
          fi
          /tmp/gitleaks/gitleaks git --no-banner --redact --log-opts="$range" .

  deploy:
    name: Deploy to Production
    if: github.event_name == 'push'
    needs: [check, secrets-scan]
    runs-on: ubuntu-latest
    environment: production
    # id-token lets the job trade GitHub's OIDC token for short-lived AWS keys.
    permissions:
      contents: read
      id-token: write
    # Only deploys queue behind each other; PR checks run in parallel.
    concurrency:
      group: production-deploy
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: "22"
          cache: npm
      # Narrow guard: this job can mint an AWS OIDC token, so install hooks are skipped.
      # sst deploy still runs dependency code; the lockfile and Dependabot cooldown cover that.
      - run: npm ci --ignore-scripts --legacy-peer-deps
      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
      - name: Deploy production
        env:
          AWS_ACCOUNT_ID: ${{ secrets.AWS_ACCOUNT_ID }}
        run: |
          test "$(aws sts get-caller-identity --query Account --output text)" = "$AWS_ACCOUNT_ID"
          npx sst deploy --stage production
