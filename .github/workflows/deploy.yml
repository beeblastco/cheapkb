name: Deploy Production

permissions:
  contents: read

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  AWS_PROFILE: cheapkb
  AWS_REGION: us-east-1
  BEDROCK_EMBEDDING_MODEL: us.cohere.embed-v4:0
  BEDROCK_ASSUME_ROLE_ARN: ${{ vars.BEDROCK_ASSUME_ROLE_ARN }}
  BEDROCK_ASSUME_ROLE_EXTERNAL_ID: ${{ vars.BEDROCK_ASSUME_ROLE_EXTERNAL_ID }}
  CHUNK_MAX_TOKENS: "700"
  CHUNK_OVERLAP_TOKENS: "100"
  MAX_UPLOAD_BYTES: "52428800"
  MAX_IMAGE_UPLOAD_BYTES: "5242880"
  MAX_CHUNKS_PER_DOCUMENT: "1000"
  EMBEDDING_INPUT_PRICE_PER_1M_TOKENS: "0.12"
  VECTOR_BATCH: "500"
  EMBED_BATCH: "10"

jobs:
  check:
    name: Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          node-version: "22"
          cache: npm
      - run: npm ci --legacy-peer-deps
      - run: npm --prefix web ci --legacy-peer-deps
      - run: npm run format:check
      - run: npm run build
      - run: npm test
      - run: API_URL=https://example.execute-api.us-east-1.amazonaws.com/v1 npm --prefix web run build
      # Advisories published upstream should not block a deploy of main;
      # PRs still fail on them and Dependabot opens the fix.
      - if: github.event_name == 'pull_request'
        run: npm audit --audit-level=high
      - if: github.event_name == 'pull_request'
        run: npm --prefix web audit --audit-level=high

  deploy:
    name: Deploy to Production
    if: github.event_name == 'push'
    needs: check
    runs-on: ubuntu-latest
    environment: production
    # Only deploys queue behind each other; PR checks run in parallel.
    concurrency:
      group: production-deploy
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          node-version: "22"
          cache: npm
      - run: npm ci --legacy-peer-deps
      - name: Configure AWS profile
        run: |
          aws configure set aws_access_key_id "${{ secrets.AWS_ACCESS_KEY_ID }}" --profile "$AWS_PROFILE"
          aws configure set aws_secret_access_key "${{ secrets.AWS_SECRET_ACCESS_KEY }}" --profile "$AWS_PROFILE"
          aws configure set region "$AWS_REGION" --profile "$AWS_PROFILE"
      - name: Verify AWS account
        run: test "$(aws sts get-caller-identity --query Account --output text)" = "${{ secrets.AWS_ACCOUNT_ID }}"
      - name: Deploy production
        env:
          AWS_ACCOUNT_ID: ${{ secrets.AWS_ACCOUNT_ID }}
        run: |
          test "$(aws sts get-caller-identity --query Account --output text)" = "$AWS_ACCOUNT_ID"
          npx sst deploy --stage production
