version: 2
updates:
  - package-ecosystem: npm
    directories: ["/", "/web"]
    schedule:
      interval: weekly
    # Skip releases younger than 3 days, so a hijacked publish is caught before it lands here.
    cooldown:
      default-days: 3
    groups:
      aws-sdk:
        patterns: ["@aws-sdk/*"]
      minor-and-patch:
        update-types: [minor, patch]
    ignore:
      # SST ships its own @pulumi/aws; bump it together with sst.
      - dependency-name: "@pulumi/aws"
      # Matches the nodejs22.x Lambda runtime; bump with the runtime.
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    # Skip releases younger than 3 days, so a hijacked publish is caught before it lands here.
    cooldown:
      default-days: 3
